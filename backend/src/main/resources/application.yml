spring:
  application:
    name: youtube-watch-party
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:watchparty}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: YouTube Watch Party
    description: Real-time synchronized YouTube watch rooms

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  websocket:
    endpoint: /ws
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mongodb:
    enabled: ${MONGODB_ENABLED:false}

logging:
  level:
    root: INFO
    com.watchparty: INFO
